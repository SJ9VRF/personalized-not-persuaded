<!doctype html><meta charset="utf-8"><title>BehaviorLab Annotation</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;height:110px}label{display:block;margin:12px 0}button{padding:12px 18px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.small{color:#666}</style><h1>BehaviorLab Annotation Packet</h1><p class="small">Offline annotation form. Paste a scenario and two responses. Ratings remain local and can be exported as JSON.</p><div class="box"><label>Scenario<textarea id="s"></textarea></label><label>Response A<textarea id="a"></textarea></label><label>Response B<textarea id="b"></textarea></label></div><div class="box"><label>Overall preference <select id="pref"><option>A</option><option>B</option><option>Tie</option></select></label><label>Truthfulness A <input id="ta" type="range" min="0" max="100" value="50"></label><label>Truthfulness B <input id="tb" type="range" min="0" max="100" value="50"></label><label>Personalization A <input id="pa" type="range" min="0" max="100" value="50"></label><label>Personalization B <input id="pb" type="range" min="0" max="100" value="50"></label><label>Sycophancy A <input id="sa" type="range" min="0" max="100" value="0"></label><label>Sycophancy B <input id="sb" type="range" min="0" max="100" value="0"></label><label>Confidence <input id="conf" type="range" min="0" max="100" value="80"></label><button onclick="exp()">Export annotation JSON</button></div><pre id="o"></pre><script>function exp(){let ids=['s','a','b','pref','ta','tb','pa','pb','sa','sb','conf'];let x={};ids.forEach(i=>x[i]=document.getElementById(i).value);document.getElementById('o').textContent=JSON.stringify(x,null,2)}</script>
